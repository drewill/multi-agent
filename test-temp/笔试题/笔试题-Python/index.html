
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek 流式聊天</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f6f7fb;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #20242c;
        }

        .app {
            max-width: 850px;
            height: 100vh;
            margin: auto;
            display: flex;
            flex-direction: column;
            background: white;
            border-left: 1px solid #eee;
            border-right: 1px solid #eee;
        }

        header {
            padding: 20px 25px;
            border-bottom: 1px solid #eee;
            font-size: 20px;
            font-weight: bold;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        .user { align-items: flex-end; }
        .assistant { align-items: flex-start; }

        .bubble {
            max-width: 85%;
            padding: 13px 17px;
            border-radius: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user .bubble {
            background: #e7efff;
        }

        .assistant .bubble {
            background: #f2f3f5;
        }

        .role {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }

        .input-area {
            padding: 18px 25px;
            border-top: 1px solid #eee;
        }

        textarea {
            width: 100%;
            resize: none;
            min-height: 75px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font: inherit;
            outline: none;
        }

        textarea:focus { border-color: #4778e8; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        #status {
            font-size: 13px;
            color: #888;
        }

        button {
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            background: #4778e8;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #stopBtn { background: #dc5555; }
    </style>
</head>

<body>
<div class="app">
    <header>DeepSeek Streaming Chat</header>

    <main id="messages">
        <div class="message assistant">
            <div class="role">AI 助手</div>
            <div class="bubble">你好！请输入你的问题。</div>
        </div>
    </main>

    <div class="input-area">
        <textarea id="question"
                  placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>

        <div class="toolbar">
            <span id="status">准备就绪</span>
            <div>
                <button id="stopBtn" hidden>停止生成</button>
                <button id="sendBtn">发送消息</button>
            </div>
        </div>
    </div>
</div>

<script>
    const messages = document.getElementById("messages");
    const questionInput = document.getElementById("question");
    const sendBtn = document.getElementById("sendBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusText = document.getElementById("status");

    let controller = null;

    // 添加消息气泡
    function addMessage(role, text = "") {
        const wrapper = document.createElement("div");
        wrapper.className = "message " + role;

        const roleName = document.createElement("div");
        roleName.className = "role";
        roleName.textContent = role === "user" ? "你" : "AI 助手";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        wrapper.appendChild(roleName);
        wrapper.appendChild(bubble);
        messages.appendChild(wrapper);

        scrollToBottom();
        return bubble;
    }

    function scrollToBottom() {
        messages.scrollTop = messages.scrollHeight;
    }

    function setLoading(loading) {
        sendBtn.disabled = loading;
        stopBtn.hidden = !loading;
    }

    // 处理一个完整 SSE 事件
    function handleEvent(rawEvent, bubble) {
        const lines = rawEvent.split("\n");
        let eventType = "message";
        const dataLines = [];

        for (const line of lines) {
            if (line.startsWith("event:")) {
                eventType = line.slice(6).trim();
            } else if (line.startsWith("data:")) {
                dataLines.push(line.slice(5).trimStart());
            }
        }

        if (dataLines.length === 0) return false;

        const rawData = dataLines.join("\n");

        // 兼容最初版本的 [DONE]
        if (rawData === "[DONE]") return true;

        let data;
        try {
            data = JSON.parse(rawData);
        } catch {
            // 兼容最初版本的纯文本 SSE
            bubble.textContent += rawData;
            scrollToBottom();
            return false;
        }

        if (eventType === "done") {
            return true;
        }

        if (eventType === "error") {
            throw new Error(data.message || "模型生成失败");
        }

        if (typeof data.content === "string") {
            bubble.textContent += data.content;
            scrollToBottom();
        }

        return false;
    }

    async function sendMessage() {
        const question = questionInput.value.trim();
        if (!question || controller) return;

        addMessage("user", question);
        questionInput.value = "";

        const bubble = addMessage("assistant", "");
        controller = new AbortController();

        setLoading(true);
        statusText.textContent = "正在生成...";

        let reader = null;

        try {
            // 发送 POST 请求
            const response = await fetch("/chat_model", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ question }),
                signal: controller.signal
            });

            if (!response.ok) {
                throw new Error("HTTP 错误：" + response.status);
            }

            if (!response.body) {
                throw new Error("浏览器不支持流式读取");
            }

            // 获取流式读取器
            reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");

            let buffer = "";
            let finished = false;

            while (!finished) {
                const { value, done } = await reader.read();

                if (done) {
                    buffer += decoder.decode();
                } else {
                    // stream:true 防止 UTF-8 中文字符被截断
                    buffer += decoder.decode(value, { stream: true });
                }

                // 统一换行符，方便识别 SSE 事件边界
                buffer = buffer.replace(/\r\n/g, "\n");

                let boundary;

                // 一个 read() 可能包含多个事件，
                // 也可能只包含半个事件
                while ((boundary = buffer.indexOf("\n\n")) !== -1) {
                    const rawEvent = buffer.slice(0, boundary);
                    buffer = buffer.slice(boundary + 2);

                    if (handleEvent(rawEvent, bubble)) {
                        finished = true;
                        break;
                    }
                }

                if (done) break;
            }

            if (!finished && buffer.trim()) {
                handleEvent(buffer, bubble);
            }

            statusText.textContent = "生成完成";

        } catch (error) {
            if (error.name === "AbortError") {
                statusText.textContent = "已停止生成";
            } else {
                statusText.textContent = "请求失败";
                bubble.textContent += "\n[错误] " + error.message;
            }
        } finally {
            if (reader) {
                try { await reader.cancel(); } catch {}
            }

            controller = null;
            setLoading(false);
            questionInput.focus();
        }
    }

    sendBtn.addEventListener("click", sendMessage);

    stopBtn.addEventListener("click", () => {
        if (controller) controller.abort();
    });

    questionInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
